name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lca_tool
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lca_tool"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lca_tool
      ADMIN_EMAILS: ci-admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm prisma generate
      - name: Prisma migrate deploy
        run: pnpm prisma migrate deploy
      - name: Prisma seed
        run: pnpm prisma db seed
      - name: Create admin user for smoke tests
        run: pnpm admin:add-user -- --email ci-admin@example.com --password AdminPass123!
      - name: Run tests
        run: pnpm test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test admin audit
        env:
          ADMIN_AUDIT_EMAIL: ci-admin@example.com
          ADMIN_AUDIT_PASSWORD: AdminPass123!
          ADMIN_AUDIT_MODE: build
          ADMIN_AUDIT_PORT: 3102
        run: pnpm smoke:admin-audit
